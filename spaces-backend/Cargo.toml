[package]
name = "spaces-backend"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
axum = { version = "0.8.9", features = ["ws"] }
futures-util = "0.3.34"
reqwest = { version = "0.13.5", features = ["json", "query"] }
rmp-serde = "1.3.1"
serde = { version = "1.0.229", features = ["derive", "rc"] }
serde_json = "1.0.151"
tokio = { version = "1.53.2", features = ["full"] }
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
